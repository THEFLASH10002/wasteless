<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WasteLess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar + role-filtered side nav + work area. Tools are scanned: summary first, detail below. */
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#ebefe8; --ink:#1b2620; --muted:#5b6a60; --line:#d7ddd4;
  --accent:#a3245b; --accent-ink:#ffffff; --accent-soft:#f5e1ea;
  --s2:#1f6f78; --s3:#c48416;
  --good:#2b7a47; --good-soft:#e0f0e5; --warn:#9a6200; --warn-soft:#f9edd2; --crit:#b3261e; --crit-soft:#fae1df;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211d; --surface-2:#212b26; --ink:#e4ebe6; --muted:#9cada2; --line:#2e3933;
    --accent:#e46b9f; --accent-ink:#22080f; --accent-soft:#3b1d2a;
    --s2:#5cb7c1; --s3:#e2aa47;
    --good:#6cc48b; --good-soft:#1d3426; --warn:#e2aa47; --warn-soft:#382d15; --crit:#f08880; --crit-soft:#3c1e1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --surface-2:#212b26; --ink:#e4ebe6; --muted:#9cada2; --line:#2e3933;
  --accent:#e46b9f; --accent-ink:#22080f; --accent-soft:#3b1d2a;
  --s2:#5cb7c1; --s3:#e2aa47;
  --good:#6cc48b; --good-soft:#1d3426; --warn:#e2aa47; --warn-soft:#382d15; --crit:#f08880; --crit-soft:#3c1e1c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px;font-family:var(--body);font-weight:600}
p{margin:0}
a{color:var(--accent)}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.brand svg{flex:none}
.clock{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who b{display:block;font-size:14px}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 10px 4px}
.navlink{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.navlink:hover{background:var(--surface-2)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.head .sub{color:var(--muted);max-width:68ch;margin-top:4px}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.card>header .note{color:var(--muted);font-size:13px}
.card>header .right{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted)}
.tile .d.good{color:var(--good)} .tile .d.crit{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{opacity:.7;margin-left:4px}
.tablewrap{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:14px}
table.data th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:none}
table.data td.n,table.data th.n{text-align:right}
table.data tr.bad td{background:var(--crit-soft)}
table.data tfoot td{font-weight:600;border-top:1px solid var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field.wide{grid-column:1/-1}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;min-width:0}
.field textarea{font-family:var(--mono);font-size:13px;min-height:150px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink);font-size:14px}
.checks label{display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.factor span:nth-child(even){font-family:var(--mono);text-align:right}
.big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--good);border-radius:99px}
.meter.warn>i{background:var(--warn)} .meter.crit>i{background:var(--crit)}
.stars{color:var(--s3);letter-spacing:1px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.box{height:10px;width:10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .grid line{stroke:var(--line)}
.banner{border-radius:var(--r);padding:12px 16px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.callout{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px}
.sev{border-left:4px solid var(--line)}
.sev.crit{border-left-color:var(--crit)} .sev.warn{border-left-color:var(--warn)} .sev.good{border-left-color:var(--good)}
.dishgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.dish .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.allergen{background:var(--warn-soft);color:var(--warn)}
.bell{position:relative}
.bell .count{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;line-height:16px}
.panel{position:absolute;right:20px;top:56px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:30;max-height:420px;overflow:auto}
.panel .item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.panel .item time{display:block;color:var(--muted);font-size:11px}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.crit{background:var(--crit);color:#fff}
.weekgrid{display:grid;grid-template-columns:90px repeat(7,minmax(84px,1fr));gap:6px;min-width:720px}
.weekgrid .h{font-size:12px;color:var(--muted);text-align:center}
.weekgrid .m{font-size:13px;align-self:center}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;background:var(--surface);cursor:pointer;font-size:12px}
.slot[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.slot[disabled]{opacity:.4;cursor:not-allowed}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:18px;color:var(--muted)}
.starpick button[aria-pressed="true"]{color:var(--s3);border-color:var(--s3)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);font-size:13px}
.badge.on{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.badge b{display:block;font-family:var(--display);font-size:20px}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.login .box{width:min(880px,100%);display:flex;flex-direction:column;gap:20px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ucard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ucard:hover{border-color:var(--accent)}
.ucard b{font-size:15px}
.ucard span{font-size:13px;color:var(--muted)}
.locked{max-width:520px}
.crowd{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:170px}
.crowd .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.crowd .col i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--s2)}
.crowd .col.busy i{background:var(--crit)} .crowd .col.mod i{background:var(--s3)}
.crowd .col.now{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.crowd .col span{font-size:10px;color:var(--muted)}
pre.out{background:var(--surface-2);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);white-space:pre-wrap;margin:0;max-height:300px;overflow:auto}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  .navgroup{flex-direction:row}
  .navgroup>span{display:none}
  .navlink{white-space:nowrap}
  main{padding:18px 16px 60px}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// ---------- utilities ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const dowOf=k=>pd(k).getDay();
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US');
const fmt1=n=>n==null||isNaN(n)?'–':(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');

const sgnPct=n=>(n>=0?'+':'')+(n*100).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- forecasting model (F4, F5, F6) ----------
function fitModel(recs,asOf){
  const W={clear:1,rain:1,snow:1,hot:1,cold:1}, E={movein:1,holiday:1,exams:1,break:1,game:1};
  const base={}; const wt=recs.map(r=>Math.pow(0.985,Math.max(0,diffD(r.date,asOf))));
  const ef=r=>r.ev?E[r.ev]:1;
  const nW={},nE={};
  for(let it=0;it<6;it++){
    for(const m of MEALS){
      base[m]=[];
      for(let d=0;d<7;d++){let num=0,den=0;recs.forEach((r,i)=>{if(r.meal===m&&r.dow===d){num+=wt[i]*r.att/(W[r.cond]*ef(r));den+=wt[i]}});base[m][d]=den?num/den:null}
      const ok=base[m].filter(v=>v!=null);const fb=ok.length?sum(ok)/ok.length:BASE[m];
      base[m]=base[m].map(v=>v==null?fb:v);
    }
    for(const c of ['rain','snow','hot','cold']){let s=0,n=0;recs.forEach(r=>{if(r.cond===c){s+=r.att/(base[r.meal][r.dow]*ef(r));n++}});W[c]=(s+2)/(n+2);nW[c]=n}
    for(const t of Object.keys(E)){let s=0,n=0;recs.forEach(r=>{if(r.ev===t){s+=r.att/(base[r.meal][r.dow]*W[r.cond]);n++}});E[t]=(s+2)/(n+2);nE[t]=n}
  }
  const rs=recs.slice(-90).map(r=>r.att/(base[r.meal][r.dow]*W[r.cond]*ef(r))-1);
  const sd=rs.length?Math.sqrt(sum(rs.map(x=>x*x))/rs.length):0.06;
  return {base,W,E,nW,nE,sd:Math.max(0.03,sd),n:recs.length,asOf};
}
function predict(mdl,k,m){
  const wx=wxOn(k),e=evOn(k);const b=mdl.base[m][dowOf(k)];const wf=mdl.W[wx.cond];const ef=e?mdl.E[e.type]:1;const p=b*wf*ef;
  return {b,wf,ef,ev:e,wx,pred:p,lo:p*(1-1.645*mdl.sd),hi:p*(1+1.645*mdl.sd)};
}
function trueAtt(k,m,noise){const e=evOn(k);return BASE[m]*DOWM[m][dowOf(k)]*W_TRUE[wxOn(k).cond]*(e?E_TRUE[e.type]:1)*(noise?1+gauss()*0.04:1)}
const key=(k,m)=>k+'|'+m;

function forecastFor(k,m){
  const p=predict(S.model,k,m);const kk=key(k,m);
  let intentF=1,intents=null,exp=null;const off=diffD(TODAY,k);
  if(off>=0&&off<7&&S.intentSim[kk]!=null){exp=p.pred*0.05;intents=S.intentSim[kk]+(S.myIntents.has(kk)?1:0);intentF=clamp(1+((intents-exp)/exp)*0.1,0.92,1.08)}
  const model=p.pred*intentF;const o=S.overrides[kk];
  const final=o?(o.mode==='fixed'?o.value:model*(1+o.value/100)):model;
  return {...p,intentF,intents,exp,model,final,override:o,lo:p.lo*intentF,hi:p.hi*intentF};
}

function dayWaste(k){return (S.dayWaste[k]||0)+sum(S.wasteLog.filter(w=>w.date===k&&!w.historic).map(w=>w.lbs))}
function dayActual(k){const r=S.history.filter(x=>x.date===k);return r.length===3?sum(r.map(x=>x.att)):null}
function dayPred(k){const v=MEALS.map(m=>S.bt[key(k,m)]);return v.every(Boolean)?sum(v.map(x=>x.pred)):null}
function phaseTotals(){
  let preD=0,preW=0,postD=0,postW=0,postDays=0;
  for(let k=START;k<TODAY;k=addD(k,1)){const a=dayActual(k)||0;const w=S.dayWaste[k]||0;if(k<GOLIVE){preD+=a;preW+=w}else{postD+=a;postW+=w;postDays++}}
  const preRate=preW/preD,postRate=postW/postD;const avoided=Math.max(0,(preRate-postRate)*postD);
  const remain=diffD(TODAY,SEM_END)+1;
  return {preD,preW,postD,postW,postDays,preRate,postRate,avoided,remain,projAvoided:avoided/postDays*(postDays+remain)};
}
function mapeRecent(days=14){
  const errs=[];for(let i=1;i<=days;i++){const k=addD(TODAY,-i);MEALS.forEach(m=>{const b=S.bt[key(k,m)];const r=S.history.find(x=>x.date===k&&x.meal===m);if(b&&r)errs.push(Math.abs(r.att-b.pred)/r.att)})}
  S.retrainLog.forEach(l=>errs.push(Math.abs(l.err)));
  return errs.length?sum(errs)/errs.length:null;
}
function shiftList(fromK,n,skipClosed=true){
  const out=[];let k=fromK;const h=demoHour();
  while(out.length<n){for(const m of MEALS){if(out.length>=n)break;if(k===TODAY){if(skipClosed&&S.closed[m])continue;if(MEAL_WIN[m][1]<=h&&skipClosed)continue}out.push({k,m})}k=addD(k,1)}
  return out;
}
function prepFor(k,m){
  const f=forecastFor(k,m);
  return dishesFor(m).map(d=>{const serv=Math.ceil(f.final*S.shareEst[d.id]*S.prepRatio[d.id]*1.05);const pans=Math.ceil(serv/d.batch);return {d,serv,pans}});
}
function ingNeed(shifts){
  const need={};
  shifts.forEach(({k,m})=>prepFor(k,m).forEach(({d,serv})=>d.ing.forEach(([id,q])=>{need[id]=(need[id]||0)+serv*q})));
  return need;
}
function stockAlerts(){
  const sh=[...shiftList(TODAY,3).filter(s=>s.k===TODAY),...MEALS.map(m=>({k:addD(TODAY,1),m}))];
  const need=ingNeed(sh);const out=[];
  for(const id in need){const ing=S.ingredients[id];const n=need[id];const safety=n*S.model.sd*1.645;
    if(ing.onHand<n+safety){const impacted=S.dishes.filter(d=>d.ing.some(x=>x[0]===id)&&sh.some(s=>s.m===d.meal)).map(d=>d.name);
      out.push({id,ing,need:n,safety,sev:ing.onHand<n?'crit':'warn',impacted})}}
  return out.sort((a,b)=>(a.sev===b.sev?0:a.sev==='crit'?-1:1));
}

// ---------- charts ----------
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function chart({labels,series,band,marker,height=250,yFmt=fmt,w=760}){
  const W=w,H=height,pl=52,pr=14,pt=14,pb=30;const n=labels.length;const iw=W-pl-pr,ih=H-pt-pb;
  const all=[];series.forEach(s=>s.values.forEach(v=>v!=null&&all.push(v)));if(band)band.hi.forEach(v=>v!=null&&all.push(v));
  const max=niceMax(Math.max(1,...all));
  const x=i=>pl+(i+0.5)*iw/n, y=v=>pt+ih-v/max*ih;
  let g='<g class="grid">';for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${yFmt(v)}</text>`}g+='</g>';
  const step=Math.ceil(n/10);let xl='';labels.forEach((l,i)=>{if(i%step===0)xl+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(l)}</text>`});
  let body='';
  if(band){let seg=[];const flush=()=>{if(seg.length>1){const top=seg.map(i=>`${x(i)},${y(band.hi[i])}`).join(' ');const bot=seg.slice().reverse().map(i=>`${x(i)},${y(band.lo[i])}`).join(' ');body+=`<polygon points="${top} ${bot}" style="fill:${band.color};opacity:.14"/>`}seg=[]};
    band.hi.forEach((v,i)=>{if(v==null)flush();else seg.push(i)});flush()}
  const bars=series.filter(s=>s.type==='bar');const bw=iw/n*0.62/Math.max(1,bars.length);
  bars.forEach((s,j)=>s.values.forEach((v,i)=>{if(v==null)return;const x0=x(i)-iw/n*0.31+j*bw;body+=`<rect x="${x0}" y="${y(v)}" width="${Math.max(1,bw-1)}" height="${Math.max(0,pt+ih-y(v))}" rx="2" style="fill:${s.color}"><title>${esc(labels[i])}: ${yFmt(v)}</title></rect>`}));
  series.filter(s=>s.type!=='bar').forEach(s=>{let d='';let pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+' '+y(v)+' ';pen=true});
    body+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2.2;${s.dash?'stroke-dasharray:5 4;':''}stroke-linejoin:round;stroke-linecap:round"/>`;
    let last=-1;s.values.forEach((v,i)=>{if(v!=null){last=i;if(n<=40)body+=`<circle cx="${x(i)}" cy="${y(v)}" r="${n<=16?3:2}" style="fill:${s.color}"><title>${esc(labels[i])} · ${esc(s.name)}: ${yFmt(v)}</title></circle>`}});
    if(last>=0)body+=`<circle cx="${x(last)}" cy="${y(s.values[last])}" r="4.5" style="fill:var(--surface);stroke:${s.color};stroke-width:2"/>`});
  if(marker!=null&&marker.i>=0){const mx=x(marker.i)-iw/n*0.5;body+=`<line x1="${mx}" x2="${mx}" y1="${pt}" y2="${pt+ih}" style="stroke:var(--muted);stroke-dasharray:3 3"/><text x="${mx+4}" y="${pt+10}">${esc(marker.label)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${body}${xl}</svg>`;
}

// ----- 1.1–1.5 Demand forecast -----
function vForecast(){
  const days=[...Array(7)].map((_,i)=>addD(TODAY,i));const sel=S.ui.fcDate;
  const ev=evOn(sel),wx=wxOn(sel);
  const cards=MEALS.map(m=>{const f=forecastFor(sel,m);const kk=key(sel,m);const closed=sel===TODAY&&S.closed[m];
    const fl=(v,l)=>`<span>${l}</span><span>×${v.toFixed(3)} <small class="muted">(${sgnPct(v-1)})</small></span>`;
    return `<div class="card">
      <header><h2>${m}</h2><span class="note">${fmtHour(MEAL_WIN[m][0])}–${fmtHour(MEAL_WIN[m][1])}</span><span class="right">${f.override?'<span class="pill acc">Manual override</span>':closed?'<span class="pill good">Service closed</span>':'<span class="pill">Model forecast</span>'}</span></header>
      <div><div class="big">${fmt(f.final)}</div><div class="small muted">diners expected · 90% range ${fmt(f.lo)}–${fmt(f.hi)}</div></div>
      <div class="factor">
        <span>Baseline (${DN[dowOf(sel)]} history)</span><span>${fmt(f.b)}</span>
        ${fl(f.wf,'Weather: '+COND_LABEL[f.wx.cond]+', '+f.wx.t+'°F')}
        ${fl(f.ef,'Calendar: '+(f.ev?esc(f.ev.label):'Regular day'))}
        ${f.intents!=null?fl(f.intentF,`Student check-ins: ${fmt(f.intents)} vs ${fmt(f.exp)} expected`):''}
        ${f.override?`<span>Override: ${f.override.mode==='fixed'?'fixed at '+fmt(f.override.value):sgnPct(f.override.value/100)}</span><span>${fmt(f.final)}</span>`:''}
      </div>
      ${closed?`<p class="small">Actual: <b class="mono">${fmt(closed.actual)}</b> diners (${sgnPct((closed.actual-closed.pred)/closed.pred)} vs forecast)</p>`:''}
      ${S.ui.ovOpen===kk?`<form class="form" data-form="override" data-key="${kk}">
          <label class="field">Type<select id="ov-mode-${m}" name="mode"><option value="offset">Adjust by %</option><option value="fixed">Set exact count</option></select></label>
          <label class="field">Value<input id="ov-val-${m}" name="value" type="number" step="1" required placeholder="e.g. 12 or 900"></label>
          <label class="field wide">Reason (saved to the audit log)<input id="ov-reason-${m}" name="reason" required placeholder="e.g. Admissions open house, 300 visitors"></label>
          <div class="row"><button class="btn primary small" type="submit">Save override</button><button class="btn small" type="button" data-act="ovclose">Cancel</button></div></form>`
        :`<div class="row">${closed?'':`<button class="btn small" data-act="ovopen" data-key="${kk}">${f.override?'Change override':'Override forecast'}</button>`}${f.override&&!closed?`<button class="btn small" data-act="ovclear" data-key="${kk}">Remove override</button>`:''}</div>`}
    </div>`}).join('');
  // 28-day chart
  const labels=[],act=[],pr=[],lo=[],hi=[];
  for(let i=-14;i<14;i++){const k=addD(TODAY,i);labels.push(dShort(k));
    if(i<0){act.push(dayActual(k));pr.push(dayPred(k));lo.push(null);hi.push(null)}
    else{const fs=MEALS.map(m=>forecastFor(k,m));act.push(null);pr.push(sum(fs.map(f=>f.final)));lo.push(sum(fs.map(f=>f.lo)));hi.push(sum(fs.map(f=>f.hi)))}}
  // rolling accuracy
  const accL=[],accV=[];
  for(let k=addD(GOLIVE,6);k<TODAY;k=addD(k,1)){const errs=[];for(let j=0;j<7;j++){const kk=addD(k,-j);MEALS.forEach(m=>{const b=S.bt[key(kk,m)];const r=S.history.find(x=>x.date===kk&&x.meal===m);if(b&&r)errs.push(Math.abs(r.att-b.pred)/r.att)})}accL.push(dShort(k));accV.push(errs.length?100-100*sum(errs)/errs.length:null)}
  const mape=mapeRecent();
  const M=S.model;
  const upcoming=S.events.filter(e=>e.end>=TODAY).sort((a,b)=>a.start<b.start?-1:1);
  return head('Demand forecast',`Machine learning forecast of diners per meal, from ${fmt(M.n)} past meal periods, weather and the academic calendar. Retrained each time a service is closed.`)+
  `<div class="tiles">
    <div class="tile"><span class="k">Forecast accuracy, last 14 days</span><span class="v">${pct(1-mape)}</span><span class="d">Mean absolute error ${pct(mape)}</span></div>
    <div class="tile"><span class="k">Expected diners today</span><span class="v">${fmt(sum(MEALS.map(m=>forecastFor(TODAY,m).final)))}</span><span class="d">${COND_LABEL[wxOn(TODAY).cond]}, ${wxOn(TODAY).t}°F</span></div>
    <div class="tile"><span class="k">Next calendar event</span><span class="v" style="font-size:20px">${upcoming[0]?esc(upcoming[0].label):'None'}</span><span class="d">${upcoming[0]?dLabel(upcoming[0].start):''}</span></div>
    <div class="tile"><span class="k">Active overrides</span><span class="v">${Object.keys(S.overrides).length}</span><span class="d">${S.audit.length} audit entries</span></div>
  </div>
  <div class="chips" role="group" aria-label="Forecast day">${days.map(k=>`<button class="chip" data-act="fcdate" data-k="${k}" aria-pressed="${k===sel}">${dLabel(k)}${evOn(k)?'<small>•</small>':''}</button>`).join('')}</div>
  ${ev?`<div class="banner"><b>${esc(ev.label)}</b> on ${dLabel(sel)}. The model learned a ×${M.E[ev.type].toFixed(2)} effect for ${EV_LABEL[ev.type].toLowerCase()} days from past data.</div>`:''}
  <div class="grid g3">${cards}</div>
  <div class="card"><header><h2>Daily diners: actual vs. forecast</h2><span class="note">Past 14 days and next 14 days, all meals</span></header>
    ${legend([{name:'Actual',color:'var(--s2)'},{name:'Forecast',color:'var(--accent)'},{name:'90% range',color:'var(--accent)',box:true}])}
    ${chart({labels,series:[{name:'Actual',values:act,color:'var(--s2)'},{name:'Forecast',values:pr,color:'var(--accent)',dash:false}],band:{lo,hi,color:'var(--accent)'},marker:{i:14,label:'Today'}})}
  </div>
  <div class="grid g2">
    <div class="card"><header><h2>Weather feed</h2><span class="note">Next 7 days · sample feed, connect a weather API in production</span></header>
      <div class="tablewrap"><table class="data"><thead><tr><th>Day</th><th>Conditions</th><th class="n">High</th><th class="n">Effect learned</th></tr></thead><tbody>
      ${days.map(k=>{const w=wxOn(k);return `<tr><td>${dLabel(k)}</td><td>${COND_LABEL[w.cond]}</td><td class="n">${w.t}°F</td><td class="n">${w.cond!=='clear'&&!M.nW[w.cond]?'<span class="muted small">No past data yet</span>':sgnPct(M.W[w.cond]-1)}</td></tr>`}).join('')}</tbody></table></div>
    </div>
    <div class="card"><header><h2>What the model has learned</h2><span class="note">Multipliers fitted from history</span></header>
      <div class="tablewrap"><table class="data"><thead><tr><th>Factor</th><th class="n">Effect</th><th class="n">Past meal periods</th></tr></thead><tbody>
      ${['rain','snow','hot','cold'].map(c=>`<tr><td>Weather: ${COND_LABEL[c]}</td><td class="n">${sgnPct(M.W[c]-1)}</td><td class="n">${M.nW[c]}</td></tr>`).join('')}
      ${Object.keys(M.E).map(t=>`<tr><td>Calendar: ${EV_LABEL[t]}</td><td class="n">${sgnPct(M.E[t]-1)}</td><td class="n">${M.nE[t]}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </div>
  <div class="card"><header><h2>Academic calendar &amp; campus events</h2><span class="note">Forecasts update as soon as you add an event</span></header>
    <form class="form" data-form="event">
      <label class="field">Starts<input id="ev-start" name="start" type="date" value="${addD(TODAY,3)}" required></label>
      <label class="field">Ends<input id="ev-end" name="end" type="date" value="${addD(TODAY,3)}" required></label>
      <label class="field">Type<select id="ev-type" name="type">${Object.keys(EV_LABEL).map(t=>`<option value="${t}">${EV_LABEL[t]}</option>`).join('')}</select></label>
      <label class="field">Name<input id="ev-label" name="label" required placeholder="e.g. Basketball home opener"></label>
      <button class="btn primary" type="submit">Add event</button>
    </form>
    <div class="tablewrap"><table class="data"><thead><tr><th>Dates</th><th>Event</th><th>Type</th><th class="n">Effect</th></tr></thead><tbody>
    ${upcoming.map(e=>`<tr><td>${dShort(e.start)}${e.end!==e.start?' – '+dShort(e.end):''}</td><td>${esc(e.label)}</td><td>${EV_LABEL[e.type]}</td><td class="n">${sgnPct(M.E[e.type]-1)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="grid g2">
    <div class="card"><header><h2>Accuracy since go-live</h2><span class="note">7-day rolling, each day predicted only from earlier data</span></header>
      ${chart({labels:accL,series:[{name:'Accuracy',values:accV,color:'var(--good)'}],height:240,yFmt:v=>Math.round(v)+'%',w:480})}
    </div>
    <div class="card"><header><h2>Retraining log</h2><span class="note">Written when a service is closed</span></header>
      ${S.retrainLog.length?`<div class="tablewrap"><table class="data"><thead><tr><th>Shift</th><th class="n">Forecast</th><th class="n">Actual</th><th class="n">Variance</th><th class="n">Error before → after</th></tr></thead><tbody>${S.retrainLog.map(l=>`<tr><td>${dShort(l.date)} ${l.meal}</td><td class="n">${fmt(l.pred)}</td><td class="n">${fmt(l.actual)}</td><td class="n">${sgnPct(l.err)}</td><td class="n">${pct(l.before)} → ${pct(l.after)}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="muted small">No services closed today yet. Close one under Waste log &amp; close service and the model retrains on the actual count.</p>`}
    </div>
  </div>
  <div class="card"><header><h2>Override audit log</h2></header>
    ${S.audit.length?`<div class="tablewrap"><table class="data"><thead><tr><th>When</th><th>Who</th><th>Shift</th><th>Change</th><th>Reason</th></tr></thead><tbody>${S.audit.map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.by)}</td><td>${esc(a.shift)}</td><td>${esc(a.change)}</td><td>${esc(a.reason)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">No overrides yet.</p>'}

// ----- 2.1 Prep guide -----
function vPrep(){
  const shifts=shiftList(TODAY,6);if(!S.ui.prepShift||!shifts.some(s=>key(s.k,s.m)===S.ui.prepShift))S.ui.prepShift=key(shifts[0].k,shifts[0].m);
  const [k,m]=S.ui.prepShift.split('|');const f=forecastFor(k,m);const rows=prepFor(k,m);const [open]=MEAL_WIN[m];
  const waves=[[open-0.5,0.5],[open+1,0.3],[open+2,0.2]];
  return head('Daily prep guide',`How much of each dish to cook, in batches timed to the crowd, so the line stays stocked without overproducing.`)+
  `<div class="chips" role="group" aria-label="Shift">${shifts.map(s=>{const kk=key(s.k,s.m);return `<button class="chip" data-act="prepshift" data-key="${kk}" aria-pressed="${kk===S.ui.prepShift}">${s.k===TODAY?'Today':dLabel(s.k)} · ${s.m}</button>`}).join('')}</div>
  <div class="tiles">
    <div class="tile"><span class="k">Diners forecast</span><span class="v">${fmt(f.final)}</span><span class="d">${f.override?'Includes manager override':'90% range '+fmt(f.lo)+'–'+fmt(f.hi)}</span></div>
    <div class="tile"><span class="k">Servings to prepare</span><span class="v">${fmt(sum(rows.map(r=>r.serv)))}</span><span class="d">Includes a 5% buffer</span></div>
    <div class="tile"><span class="k">Pans / batches</span><span class="v">${fmt(sum(rows.map(r=>r.pans)))}</span><span class="d">${rows.length} dishes</span></div>
  </div>
  <div class="card"><header><h2>${k===TODAY?'Today':dLabel(k)} · ${m}</h2><span class="note">Service ${fmtHour(MEAL_WIN[m][0])}–${fmtHour(MEAL_WIN[m][1])}</span></header>
  <div class="tablewrap"><table class="data"><thead><tr><th>Dish</th><th>Station</th><th class="n">Servings</th><th class="n">Batch size</th><th class="n">Pans</th><th>Batch schedule</th><th>Adjustment</th></tr></thead><tbody>
  ${rows.map(({d,serv,pans})=>{let left=pans;const sch=waves.map(([t,fr],i)=>{const p=i===2?left:Math.min(left,i===0?Math.ceil(pans*fr):Math.round(pans*fr));left-=p;return p?`<span class="pill">${fmtHour(t)} · ${p}</span>`:''}).join(' ');
    const r=S.prepRatio[d.id];return `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.station)}</td><td class="n">${fmt(serv)}</td><td class="n">${d.batch}</td><td class="n">${pans}</td><td><div class="row">${sch}</div></td><td>${r<1?`<span class="pill warn">Trimmed ${pct(1-r,0)}</span>`:'<span class="muted small">None</span>'}</td></tr>`}).join('')}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${fmt(sum(rows.map(r=>r.serv)))}</td><td></td><td class="n">${fmt(sum(rows.map(r=>r.pans)))}</td><td colspan="2"></td></tr></tfoot></table></div>
  <p class="small muted">Servings = diners forecast × the dish's take rate × any trim set in Menu performance × 1.05 buffer. Half the pans go out 30 minutes before opening, the rest at the peak and late service.</p></div>`;
}

// ----- 2.2 Purchasing -----
function vPurchasing(){
  const h=S.ui.horizon;const tomorrow=addD(TODAY,1);
  const todayRest=shiftList(TODAY,3).filter(s=>s.k===TODAY);
  const sh=[...todayRest];for(let i=0;i<h;i++)MEALS.forEach(m=>sh.push({k:addD(tomorrow,i),m}));
  const need=ingNeed(sh);const sd=S.model.sd;
  const rows=Object.keys(S.ingredients).map(id=>{const ing=S.ingredients[id];const n=need[id]||0;const safety=Math.ceil(n*sd*1.645);
    let note='';let cover=n;
    if(ing.shelf<h+1){const sh2=[...todayRest];for(let i=0;i<ing.shelf-1;i++)MEALS.forEach(m=>sh2.push({k:addD(tomorrow,i),m}));cover=ingNeed(sh2)[id]||0;note=`Keeps ${ing.shelf} days: split into two deliveries`}
    const order=Math.max(0,Math.ceil(cover+safety-ing.onHand));return {id,ing,n,safety,order,cost:order*ing.cost,note}}).filter(r=>r.n>0);
  const total=sum(rows.map(r=>r.cost));
  return head('Purchasing recommendations',`What to order so stock covers forecast demand plus a safety buffer, without over-ordering perishables.`)+
  `<div class="row"><span class="small muted">Cover today plus the next</span><div class="chips">${[2,3,5].map(n=>`<button class="chip" data-act="horizon" data-n="${n}" aria-pressed="${n===h}">${n} days</button>`).join('')}</div></div>
  <div class="tiles">
    <div class="tile"><span class="k">Items to order</span><span class="v">${rows.filter(r=>r.order>0).length}</span><span class="d">of ${rows.length} ingredients in use</span></div>
    <div class="tile"><span class="k">Estimated order cost</span><span class="v">${money(total)}</span><span class="d">${dShort(tomorrow)} – ${dShort(addD(tomorrow,h-1))}</span></div>
    <div class="tile"><span class="k">Safety buffer</span><span class="v">${pct(sd*1.645,0)}</span><span class="d">Covers 95% of forecast error</span></div>
  </div>
  <div class="card"><div class="tablewrap"><table class="data"><thead><tr><th>Ingredient</th><th class="n">On hand</th><th class="n">Forecast need</th><th class="n">Safety stock</th><th class="n">Order</th><th class="n">Cost</th><th>Note</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.ing.name)}</b></td><td class="n">${fmt(r.ing.onHand)} ${r.ing.unit}</td><td class="n">${fmt(r.n)}</td><td class="n">${fmt(r.safety)}</td><td class="n">${r.order?`<b>${fmt(r.order)} ${r.ing.unit}</b>`:'<span class="muted">0</span>'}</td><td class="n">${r.order?money(r.cost):'–'}</td><td class="small muted">${r.note}</td><td>${r.order?`<button class="btn small" data-act="receive" data-id="${r.id}" data-q="${r.order}">Mark received</button>`:''}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="5">Total</td><td class="n">${money(total)}</td><td colspan="2"></td></tr></tfoot></table></div>
  <p class="small muted">Need = forecast servings × recipe quantity per serving, for each shift in the window. Order = need + safety stock − on hand.</p></div>
  ${S.received.length?`<div class="card"><header><h2>Received today</h2></header><ul class="small">${S.received.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}`;
}

// ----- 2.4 Menu performance -----
function vMenuPerf(){
  const rows=S.dishes.map(d=>{const st=S.dishStats[d.id];const take=st.att?st.served/st.att:null;const wr=st.prepared?(st.prepared-st.served)/st.prepared:null;const r=avgRating(d.id);
    const flag=wr!=null&&wr>0.10&&r!=null&&r<3.6;const rec=flag?Math.min(0.3,Math.round(wr*0.8*100)/100):0;return {d,take,wr,r,n:S.ratings[d.id].n,flag,rec}});
  const flagged=rows.filter(r=>r.flag);
  return head('Menu performance',`Dish popularity next to waste rates and student ratings since go-live. Dishes with high waste and low ratings get a smaller prep quantity.`)+

function buckets(tf){
  const out=[];const end=addD(TODAY,-1);
  if(tf==='day'){for(let i=27;i>=0;i--){const k=addD(end,-i);out.push({label:dShort(k),days:[k]})}}
  else if(tf==='week'){for(let k=START;k<=end;k=addD(k,7)){const days=[];for(let j=0;j<7;j++){const d=addD(k,j);if(d<=end)days.push(d)}out.push({label:'Wk of '+dShort(k),days})}}
  else if(tf==='month'){const ms={};for(let k=START;k<=end;k=addD(k,1)){const mm=MN[pd(k).getMonth()];(ms[mm]=ms[mm]||[]).push(k)}for(const mm in ms)out.push({label:mm+(mm==='Nov'?' (to date)':''),days:ms[mm]})}
  else{PRIOR_SEM.forEach(p=>out.push({label:p.label,fixed:p}));const days=[];for(let k=START;k<=end;k=addD(k,1))days.push(k);out.push({label:'Fall 2026 (to date)',days})}
  return out.map(b=>{if(b.fixed)return {label:b.label,actual:b.fixed.diners,pred:null,waste:b.fixed.waste};
    const a=sum(b.days.map(k=>dayActual(k)||0));const ps=b.days.map(dayPred);const pred=ps.every(v=>v!=null)?sum(ps):null;return {label:b.label,actual:a,pred,waste:sum(b.days.map(k=>S.dayWaste[k]||0))}});
}

function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=pd(s);return dk(d)===s}
function parseUpload(text){
  text=text.trim();if(!text)return {error:'Paste CSV or JSON data, or choose a file.'};
  let rows,header;
  if(text[0]==='['){try{const arr=JSON.parse(text);if(!Array.isArray(arr)||!arr.length)return {error:'The JSON must be a list of records.'};header=Object.keys(arr[0]).map(h=>h.trim().toLowerCase());rows=arr.map(o=>header.map(h=>o[Object.keys(o).find(x=>x.trim().toLowerCase()===h)]??''))}catch(e){return {error:'The JSON could not be read: '+e.message}}}
  else{const lines=text.split(/\r?\n/).filter(l=>l.trim());header=lines[0].split(',').map(h=>h.trim().toLowerCase());rows=lines.slice(1).map(l=>l.split(',').map(c=>c.trim()))}
  const missing=UPLOAD_COLS.filter(c=>!header.includes(c));
  if(missing.length)return {error:'Missing required column'+(missing.length>1?'s':'')+': '+missing.join(', ')+'. Required: '+UPLOAD_COLS.join(', ')+'. Optional: waste_lbs.'};
  const ix=c=>header.indexOf(c);const names=Object.fromEntries(S.dishes.map(d=>[d.name.toLowerCase(),d]));
  const out=rows.map((r,i)=>{const errs=[];const g=c=>String(r[ix(c)]??'').trim();
    if(!validDate(g('date')))errs.push('date must be a real date as YYYY-MM-DD');
    const mp=g('meal_period');if(!MEALS.map(m=>m.toLowerCase()).includes(mp.toLowerCase()))errs.push('meal_period must be Breakfast, Lunch or Dinner');
    if(!names[g('menu_item').toLowerCase()])errs.push('menu_item not in the catalog; add it under Menu & recipes first');
    const s=g('servings_sold');if(!/^\d+$/.test(s))errs.push('servings_sold must be a whole number');
    if(ix('waste_lbs')>=0){const w=g('waste_lbs');if(w&&!(+w>=0))errs.push('waste_lbs must be a number')}
    return {line:i+2,cells:r,errs}});
  return {header,rows:out};
}

// ----- 5.2 Crowd -----
function crowdFor(k){
  const prof={Breakfast:{7:.25,8:.4,9:.35},Lunch:{11:.25,12:.45,13:.3},Dinner:{17:.3,18:.45,19:.25}};
  const hours=[];for(let h=7;h<=20;h++){let load=0;MEALS.forEach(m=>{const p=prof[m][h];if(p)load+=forecastFor(k,m).final*p});hours.push({h,load,wait:Math.max(0,Math.round((load-300)/22))})}
  return hours;
}
function vCrowd(){
  const k=S.ui.crowdDay;const hrs=crowdFor(k);const max=Math.max(...hrs.map(x=>x.load));const nowH=Math.floor(demoHour());
  const open=hrs.filter(x=>x.load>0);const best=MEALS.map(m=>{const c=hrs.filter(x=>x.h>=MEAL_WIN[m][0]&&x.h<MEAL_WIN[m][1]);return {m,best:c.reduce((a,b)=>b.load<a.load?b:a)}});
  return head('Crowd forecast','Predicted busy hours at the dining hall, so you can skip the longest lines.')+
  `<div class="chips">${[TODAY,addD(TODAY,1),addD(TODAY,2)].map(d=>`<button class="chip" data-act="crowdday" data-k="${d}" aria-pressed="${d===k}">${d===TODAY?'Today':dLabel(d)}</button>`).join('')}</div>
  <div class="tiles">${best.map(b=>`<div class="tile"><span class="k">Quietest ${b.m.toLowerCase()} hour</span><span class="v" style="font-size:22px">${fmtHour(b.best.h)}</span><span class="d">About ${b.best.wait} min wait</span></div>`).join('')}</div>
  <div class="card"><header><h2>${k===TODAY?'Today':dLabel(k)}</h2><span class="note">Expected diners arriving per hour</span></header>
    ${legend([{name:'Quiet',color:'var(--s2)',box:true},{name:'Moderate',color:'var(--s3)',box:true},{name:'Busy',color:'var(--crit)',box:true}])}
    <div class="tablewrap"><div class="crowd" style="min-width:560px">${hrs.map(x=>{const cls=x.wait>=12?'busy':x.wait>=5?'mod':'';return `<div class="col ${cls} ${k===TODAY&&x.h===nowH?'now':''}" title="${fmtHour(x.h)}: ${fmt(x.load)} diners, ~${x.wait} min wait"><span>${x.load?x.wait+'m':''}</span><i style="height:${x.load?Math.max(4,x.load/max*120):0}px"></i><span>${(((x.h+11)%12)+1)}${x.h<12?'a':'p'}</span></div>`}).join('')}</div></div>
    <p class="small muted">Numbers above the bars are estimated wait times. ${k===TODAY?'The outlined hour is now.':''} The dining hall is closed in hours with no bar.</p>

}

const FORMS={
  override(f){const kk=f.dataset.key;const mode=f.mode.value;const val=+f.value.value;const reason=f.reason.value.trim();
    if(!reason){toast('Add a reason for the override.','crit');return}
    if(mode==='fixed'&&val<0){toast('The count must be 0 or more.','crit');return}
    if(mode==='offset'&&(val<-100||val>200)){toast('Use an adjustment between -100% and +200%.','crit');return}
    const before=forecastFor(...kk.split('|')).final;
    S.overrides[kk]={mode,value:val,reason,by:S.user.name,at:stamp()};const after=forecastFor(...kk.split('|')).final;
    S.audit.unshift({at:stamp(),by:S.user.name,shift:dShort(kk.split('|')[0])+' '+kk.split('|')[1],change:`${fmt(before)} → ${fmt(after)} (${mode==='fixed'?'fixed':sgnPct(val/100)})`,reason});
    S.ui.ovOpen=null;toast('Override saved. Prep and purchasing updated.');render()},
  event(f){const s=f.start.value,e=f.end.value;if(e<s){toast('The end date is before the start date.','crit');return}
    S.events.push({id:uid(),start:s,end:e,type:f.type.value,label:f.label.value.trim()});toast('Event added. Forecasts for those days now include it.');render()},
  restock(f){const ing=S.ingredients[f.dataset.id];const q=+f.q.value;if(!(q>0))return;ing.onHand+=q;S.received.unshift(`${fmt(q)} ${ing.unit} ${ing.name} · ${stamp()}`);toast(`${ing.name} stock is now ${fmt(ing.onHand)} ${ing.unit}.`);render()},
  waste(f){const lbs=+f.lbs.value;if(!(lbs>0)){toast('Enter a weight above 0.','crit');return}
    S.wasteLog.unshift({id:uid(),ts:stamp(),date:TODAY,meal:f.meal.value,dish:f.dish.value,kind:f.kind.value,lbs,by:S.user.name,note:f.note.value.trim()});
    toast(`Saved ${fmt1(lbs)} lb of ${f.kind.value.toLowerCase()} for ${dishById(f.dish.value).name}.`);render()},
  close(f){const m=f.meal.value;const actual=+f.actual.value;if(!(actual>=0))return;
    const fc=forecastFor(TODAY,m);const err=(actual-fc.final)/fc.final;
    const test=S.history.slice(-21);const evalErr=mdl=>{const rs=[...test,{date:TODAY,meal:m,att:actual}];return sum(rs.map(r=>Math.abs(r.att-predict(mdl,r.date,r.meal).pred)/r.att))/rs.length};
    const before=evalErr(S.model);const e=evOn(TODAY);
    S.history.push({date:TODAY,meal:m,dow:dowOf(TODAY),cond:wxOn(TODAY).cond,ev:e?e.type:null,att:actual});
    S.model=fitModel(S.history,addD(TODAY,1));const after=evalErr(S.model);
    S.closed[m]={actual,pred:fc.final};S.retrainLog.unshift({date:TODAY,meal:m,pred:fc.final,actual,err,before,after});
    notify(['manager'],`${m} closed: ${fmt(actual)} diners vs ${fmt(fc.final)} forecast. Model retrained.`);
    S.ui.cMeal=null;toast(`${m} closed. Model retrained on ${fmt(S.model.n)} meal periods.`);render()},
  settings(f){S.settings={costPerLb:+f.costPerLb.value||0,systemCost:+f.systemCost.value||0,co2:+f.co2.value||0};toast('Report recalculated.');render()},
  dish(f){const id=f.dataset.id||('d'+uid());const isNew=!f.dataset.id;
    const ing=[...f.querySelectorAll('.ingrow')].map(r=>[r.querySelector('[name=ingid]').value,+r.querySelector('[name=ingq]').value]).filter(x=>x[1]>0);
    if(!ing.length){toast('Add at least one ingredient with a quantity.','crit');return}
    const data={name:f.name.value.trim(),meal:f.meal.value,station:f.station.value.trim(),oz:+f.oz.value,batch:+f.batch.value,diet:[...f.querySelectorAll('[name=diet]:checked')].map(x=>x.value),allergens:[...f.querySelectorAll('[name=allergens]:checked')].map(x=>x.value),ing};
    if(isNew){const share=+f.share.value/100;S.dishes.push({id,...data,planned:share,true:share});S.prepRatio[id]=1;S.dishStats[id]={prepared:0,served:0,wasteLbs:0,att:0};S.ratings[id]={sum:0,n:0};S.shareEst[id]=share}
    else{Object.assign(dishById(id),data);S.shareEst[id]=+f.share.value/100}
    S.ui.editDish=null;toast(`${data.name} saved. Prep guidance and purchasing updated.`);render()},
  rate(f){if(!S.ui.stars){toast('Pick a star rating first.','crit');return}const d=f.dish.value;const r={dish:d,stars:S.ui.stars,text:f.text.value.trim(),date:TODAY};
    S.ratings[d].sum+=r.stars;S.ratings[d].n++;S.feedback.unshift(r);S.myRatings.unshift(r);S.ui.stars=0;toast('Thanks! Your rating was sent anonymously to the kitchen.');render()}
};
const CHANGES={
  wmeal(el){S.ui.wMeal=el.value;render()},
  cmeal(el){S.ui.cMeal=el.value;render()},
  optin(el){S.notifyOptIn=el.checked},
  role(el){const u=S.users.find(x=>x.id===el.dataset.id);const admins=S.users.filter(x=>x.role==='admin');
    if(u.role==='admin'&&admins.length===1&&el.value!=='admin'){toast('Keep at least one administrator.','crit');el.value='admin';return}
    u.role=el.value;toast(`${u.name} is now ${ROLES[u.role]}.`);render()},
  perm(el){const s=S.perms[el.dataset.v];el.checked?s.add(el.dataset.r):s.delete(el.dataset.r);render()},
  upfile(el){const file=el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{S.ui.upText=String(rd.result);S.ui.upload=parseUpload(S.ui.upText);render()};rd.readAsText(file)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el,e);return}
  if(S.ui.bell&&!e.target.closest('.panel')){S.ui.bell=false;myNotes().forEach(n=>n.read=true);render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&CHANGES[el.dataset.change])CHANGES[el.dataset.change](el)});
window.addEventListener('hashchange',()=>{S.ui.bell=false;render();window.scrollTo(0,0)});

// ---------- live service simulation (5.1, 5.3) ----------
setInterval(()=>{
  const clk=document.getElementById('clk');if(clk)clk.textContent=fmtHour(demoHour());
  const m=currentMeal();if(!m)return;
  const ds=dishesFor(m);const tot=sum(ds.map(d=>d.true));let r=rand()*tot;let d=ds[0];for(const x of ds){r-=x.true;if(r<=0){d=x;break}}
  if(S.live[d.id]==null)S.live[d.id]=60;
  const before=S.live[d.id];let after=Math.max(0,before-(1+rand()*3));
  if(before<4&&rand()<0.5){after=35+rand()*20}
  S.live[d.id]=after;
  const popular=ds.slice().sort((a,b)=>b.true-a.true).slice(0,3).map(x=>x.id);
  if(before>=10&&after<10&&after>0){const txt=`${d.name} is almost gone at ${m.toLowerCase()}. Head over soon if you want it.`;
    if(S.watch.has(d.id)||(S.notifyOptIn&&popular.includes(d.id))){notify(['student'],txt);if(S.user&&S.user.role==='student')toast(txt)}}
  if(before<4&&after>30){notify(['student'],`A fresh batch of ${d.name} just went out.`)}
  if(S.user&&location.hash==='#smenu'){const g=document.getElementById('menuGrid');if(g)g.innerHTML=menuGrid()}
  if(S.user&&S.user.role==='student'){const b=document.querySelector('.bell');if(b){const u=myNotes().filter(n=>!n.read).length;b.innerHTML='Alerts'+(u?`<span class="count">${u}</span>`:'')}}
},4000);

render();
</script>
